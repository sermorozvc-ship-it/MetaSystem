[build]
  command = "npm run build"
  publish = "out"

# Pretty URLs - serve .html files without extension
[[redirects]]
  from = "/progress"
  to = "/progress.html"
  status = 200

[[redirects]]
  from = "/journal"
  to = "/journal.html"
  status = 200

[[redirects]]
  from = "/messages"
  to = "/messages.html"
  status = 200

[[redirects]]
  from = "/settings"
  to = "/settings.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/auth"
  to = "/auth.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin/debug"
  to = "/admin/debug.html"
  status = 200

[[redirects]]
  from = "/waiting-room"
  to = "/waiting-room.html"
  status = 200

# Fallback - SPA catch-all for any other routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
